<?php 
 
$string = "Hello, World!"; 
 
$greeting = $string . " Welcome to PHP string handling."; 
echo "Concatenated String: " . $greeting . "<br>"; 
 
$length = strlen($string); 
echo "Length of the string: " . $length . "<br>"; 

$reversed = strrev($string); 
echo "Reversed String: " . $reversed . "<br>"; 
 
$uppercase = strtoupper($string); 
echo "Uppercase String: " . $uppercase . "<br>"; 
 
$lowercase = strtolower($string); 
echo "Lowercase String: " . $lowercase . "<br>"; 
 
$substring = substr($string, 7, 5); 
echo "Substring: " . $substring . "<br>"; 
 
$replaced = str_replace("World", "PHP", $string); 
echo "Replaced String: " . $replaced . "<br>"; 
 
$contains = strpos($string, "World") !== false ? "Yes" : "No"; 
echo "Contains 'World'? " . $contains . "<br>"; 
 
$words = explode(" ", $string); 
echo "Words in the string: "; 
print_r($words); 
?> 

Output:

Concatenated String: Hello, World! Welcome to PHP string handling.
Length of the string: 13
Reversed String: !dlroW ,olleH
Uppercase String: HELLO, WORLD!
Lowercase String: hello, world!
Substring: World
Replaced String: Hello, PHP!
Contains 'World'? Yes
Words in the string: Array ( [0] => Hello, [1] => World! )

<?php 

function add($a, $b) { 
return $a + $b; 
} 

function greet() { 
echo "Hello, World!<br>"; 
} 

function say($message = "Default message") { 
echo $message . "<br>"; 
} 

function sum(...$numbers) { 
$total = 0; 
foreach ($numbers as $number) { 
$total += $number; 
} 
return $total; 
} 

function increment() { 
static $counter = 0; 
$counter++; 

echo "Counter: $counter<br>"; 
} 

function double(&$value) { 
$value *= 2; 
} 

function factorial($n) { 
if ($n <= 1) { 
return 1; 
} else { 
return $n * factorial($n - 1); 
} 
} 

function divide(float $a, float $b): float { 
if ($b == 0) { 
throw new Exception("Division by zero"); 
} 
return $a / $b; 
} 

echo "Addition result: " . add(5, 3) . "<br>";  
greet();  
say(); 
say("Custom message"); 

echo "Sum result: " . sum(1, 2, 3, 4, 5) . "<br>"; 
increment(); 
increment(); 
$value = 10; 
double($value); 
echo "Doubled value: $value<br>"; 
echo "Factorial of 5: " . factorial(5) . "<br>"; 
try { 
echo "Division result: " . divide(10.0, 2.0) . "<br>"; 
echo "Division result: " . divide(5.0, 0.0) . "<br>"; 
} catch (Exception $e) { 
echo "Exception caught: " . $e->getMessage() . "<br>"; 
} 
?>

<?php 

class BaseClass { 

public function showMessage() { 
echo "This is the base class method.\n"; 
} 
 

public function __call($name, $arguments) {
    echo "Method '$name' with arguments: "
        . implode(', ', $arguments) . "\n";
}
} 
 

class DerivedClass extends BaseClass { 

public function showMessage() { 
echo "This is the derived class method.\n"; 
} 

public function __call($name, $arguments) {
    echo "DerivedClass: Method '$name' with arguments: "
        . implode(', ', $arguments) . "\n";
}
} 
 
 
$base = new BaseClass(); 
$derived = new DerivedClass(); 
 

$base->showMessage();  
$derived->showMessage(); 
 

$base->undefinedMethod('arg1', 'arg2');
$derived->anotherUndefinedMethod('arg3', 'arg4'); 

?> 

Output:

This is the base class method.
This is the derived class method.
Method 'undefinedMethod' with arguments: arg1, arg2 
DerivedClass: Method 'anotherUndefinedMethod' with arguments: arg3, arg4

<?php

class Animal {
    public $name;
    public $sound;

    
    public function __construct($name, $sound) {
        $this->name = $name;
        $this->sound = $sound;
    }

    
    public function makeSound() {
        echo $this->name . " says " . $this->sound . "<br>";
    }
}


class Dog extends Animal {
    public function fetch() {
        echo $this->name . " is fetching the ball!<br>";
    }
}


class Cat extends Animal {
    public function purr() {
        echo $this->name . " is purring!<br>";
    }
}


$dog = new Dog("Buddy", "Woof");
$cat = new Cat("Whiskers", "Meow");


$dog->makeSound();
$cat->makeSound();


$dog->fetch();
$cat->purr();
?>

Output:

Buddy says Woof
Whiskers says Meow
Buddy is fetching the ball!
Whiskers is purring!

    <script>
        function showText(number) {

            // Hide all 10 text areas
            for (let i = 1; i <= 10; i++) {
                document.getElementById("panel" + i)
                    .classList.add("hidden");

                document.getElementById("btn" + i)
                    .classList.remove("active");
            }

            // Show only the selected text area
            document.getElementById("panel" + number)
                .classList.remove("hidden");

            // Highlight the selected button
            document.getElementById("btn" + number)
                .classList.add("active");
        }

        // Show the first text area by default
        showText(1);
    </script>
